name: Bülten Oluştur

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: write

jobs:
  bulten:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kütüphaneleri yükle
        run: pip install -r requirements.txt

      - name: Haberleri topla
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/fetch_news.py

      - name: HTML bülten oluştur
        run: python scripts/generate_html.py

      - name: Repoya kaydet
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/weekly_news.json bulletins/index.html
          git commit -m "📰 Bülten güncellendi - $(date +'%Y-%m-%d')" || echo "Değişiklik yok"
          git push
