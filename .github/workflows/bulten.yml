name: Haftalık Bülten

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

jobs:
  bulten:
    runs-on: ubuntu-latest

    permissions:
      contents: write        # ← git push için şart!

    steps:
      - name: 📥 Kodu çek
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Python kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Kütüphaneleri yükle
        run: pip install -r requirements.txt

      - name: 📡 Haberleri topla ve analiz et
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/ai_analyze.py

      - name: 🚀 WordPress'e yayınla
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python scripts/publish_wordpress.py

      - name: 💾 Repoya kaydet
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "📰 Haftalık bülten - $(date +'%Y-%m-%d')"
          git push
