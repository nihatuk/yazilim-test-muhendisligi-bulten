name: Haftalık Bülten

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'  # Her Pazartesi 09:00 UTC

permissions:
  contents: write

jobs:
  bulten:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Kodu çek
        uses: actions/checkout@v4

      - name: 🐍 Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Kütüphaneleri yükle
        run: pip install -r requirements.txt

      - name: 📡 Haberleri topla
        run: python scripts/fetch_news.py

      - name: 🤖 ChatGPT ile analiz et
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/ai_analyze.py

      - name: 🚀 WordPress'e yayınla
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python scripts/publish_wordpress.py

      - name: 💾 Repoya kaydet
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/weekly_news.json
          git commit -m "📰 Bülten güncellendi - $(date +'%Y-%m-%d')" || echo "Değişiklik yok"
          git push
